    });
    var checkedN = 0;
    CHAPTERS.forEach(function (_, i) { var el = document.getElementById("chscore" + (i + 1)); if (checkedChapters[i + 1]) { el.textContent = chOk[i + 1] + "/" + chN[i + 1] + " 正解"; checkedN += chN[i + 1]; } else { el.textContent = ""; } });
    var s = document.getElementById("score"); s.textContent = "正解 " + ok + "/" + checkedN; s.classList.remove("hidden-score");
    document.body.classList.add("checked");
    document.getElementById("btnHide").hidden = false;
    if (!silent) window.scrollTo({ top: 0 });
  }
  function hide() {
    checkedChapters = {};
    document.body.classList.remove("checked");
    document.getElementById("score").classList.add("hidden-score");
    document.getElementById("btnHide").hidden = true;
    CHAPTERS.forEach(function (_, i) { document.getElementById("chscore" + (i + 1)).textContent = ""; });
  }

  root.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.no) {
      var no = b.dataset.no;
      answers[no] = (answers[no] === b.dataset.l) ? undefined : b.dataset.l;
      if (!answers[no]) delete answers[no];
      save(); render();
    } else if (b.classList.contains("chcheck")) {
      check(true, +b.dataset.ch);
      b.closest("section").scrollIntoView({ block: "start" });
    } else if (b.classList.contains("chreset")) {
      var c = +b.dataset.ch;
      if (!confirm("第" + c + "章の答えをすべて消します。よろしいですか？")) return;
      DATA.forEach(function (p) { if (p.ch === c) delete answers[p.no]; });
      save(); render();
    }
  });
  document.getElementById("btnCheck").addEventListener("click", function () { check(false); });
  document.getElementById("btnHide").addEventListener("click", hide);
  document.getElementById("btnFilter").addEventListener("click", function () {
    var on = document.body.classList.toggle("only-unanswered");
    this.setAttribute("aria-pressed", on ? "true" : "false");
    this.textContent = on ? "すべて表示" : "未回答だけ表示";
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    if (!confirm("100問すべての答えを消します。よろしいですか？")) return;
    answers = {}; save(); hide(); render();
  });
  document.getElementById("total").textContent = DATA.length;
  render();
})();
</script>

</body>
</html>
