        return "<button data-no=\"" + p.no + "\" data-l=\"" + l + "\" aria-pressed=\"false\" aria-label=\"第" + p.ch + "回 問" + p.q + " " + l + "\">" + l + "</button>";
      }).join("");
      row.innerHTML = "<div class=\"no\">問" + p.q + "</div><div class=\"ttl\"><span class=\"d\">" + p.g + "</span> " + p.title + "<span class=\"d\">" + stars + "</span></div><div class=\"choices\">" + ch + "</div><div class=\"mark\"></div>";
      sec.appendChild(row);
      rows[p.no] = row;
    });
    root.appendChild(sec);
  });

  function render() {
    var done = 0;
    DATA.forEach(function (p) {
      var row = rows[p.no], a = answers[p.no];
      row.querySelectorAll(".choices button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === a ? "true" : "false"); });
      row.classList.toggle("answered", !!a);
      if (a) done++;
    });
    document.getElementById("done").textContent = done;
    document.getElementById("fill").style.width = (done / DATA.length * 100) + "%";
    if (document.body.classList.contains("checked")) check(true, null, true);
  }

  function check(silent, onlyCh, keep) {
    if (keep) { } else if (onlyCh) { checkedChapters[onlyCh] = true; } else { CHAPTERS.forEach(function (_, i) { checkedChapters[i + 1] = true; }); }
    var ok = 0, chOk = {}, chN = {};
    DATA.forEach(function (p) {
      var row = rows[p.no], a = answers[p.no], m = row.querySelector(".mark");
      row.classList.remove("ok", "ng", "none");
      if (!checkedChapters[p.ch]) { return; }
      chN[p.ch] = (chN[p.ch] || 0) + 1; chOk[p.ch] = chOk[p.ch] || 0;
      if (!a) { row.classList.add("none"); m.textContent = "未回答　戻る章：" + p.back; }
      else if (a === p.a) { row.classList.add("ok"); m.textContent = "○ 正解"; ok++; chOk[p.ch]++; }
      else { row.classList.add("ng"); m.textContent = "× 正解は " + p.a + "（あなたの答え：" + a + "）　戻る章：" + p.back; }
    });
    var checkedN = 0;
    CHAPTERS.forEach(function (_, i) { var el = document.getElementById("chscore" + (i + 1)); if (checkedChapters[i + 1]) { el.textContent = chOk[i + 1] + "/" + chN[i + 1] + " 正解"; checkedN += chN[i + 1]; } else { el.textContent = ""; } summary(i + 1); });
    var s = document.getElementById("score"); s.textContent = "正解 " + ok + "/" + checkedN; s.classList.remove("hidden-score");
    document.body.classList.add("checked");
    document.getElementById("btnHide").hidden = false;
    if (!silent) window.scrollTo({ top: 0 });
  }
  function summary(c) {
    var el = document.getElementById("sum" + c);
    if (!checkedChapters[c]) { el.innerHTML = ""; return; }
    var G = {}, GN = {}, back = {};
    DATA.forEach(function (p) {
      if (p.ch !== c) return;
      GN[p.g] = (GN[p.g] || 0) + 1; G[p.g] = G[p.g] || 0;
      if (answers[p.no] === p.a) G[p.g]++;
      else back[p.back] = (back[p.back] || 0) + 1;
    });
    var t = ["計算", "推論", "表の読み取り"].map(function (g) { return g + " " + (G[g] || 0) + "/" + GN[g]; }).join("　");
    var keys = Object.keys(back).sort();
    var h = "<b>分野別の正答数</b>　" + t;
    if (keys.length) {
      h += "<br><b>復習に戻る章</b>（間違い・未回答の問の戻る先）<ul>" + keys.map(function (k) { return "<li>" + k + "（" + back[k] + "問）</li>"; }).join("") + "</ul>";
    } else { h += "<br>全問正解です。"; }
    el.innerHTML = h;
  }
  function hide() {
    checkedChapters = {};
    document.body.classList.remove("checked");
    document.getElementById("score").classList.add("hidden-score");
    document.getElementById("btnHide").hidden = true;
    CHAPTERS.forEach(function (_, i) { document.getElementById("chscore" + (i + 1)).textContent = ""; document.getElementById("sum" + (i + 1)).innerHTML = ""; });
  }

  root.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.no) {
      var no = b.dataset.no;
      answers[no] = (answers[no] === b.dataset.l) ? undefined : b.dataset.l;
      if (!answers[no]) delete answers[no];
      save(); render();
    } else if (b.classList.contains("chcheck")) {
      check(true, +b.dataset.ch);
      b.closest("section").scrollIntoView({ block: "start" });
    } else if (b.classList.contains("chreset")) {
      var c = +b.dataset.ch;
      if (!confirm("第" + c + "回の答えをすべて消します。よろしいですか？")) return;
      DATA.forEach(function (p) { if (p.ch === c) delete answers[p.no]; });
      save(); render();
    }
  });
  document.getElementById("btnCheck").addEventListener("click", function () { check(false); });
  document.getElementById("btnHide").addEventListener("click", hide);
  document.getElementById("btnFilter").addEventListener("click", function () {
    var on = document.body.classList.toggle("only-unanswered");
    this.setAttribute("aria-pressed", on ? "true" : "false");
    this.textContent = on ? "すべて表示" : "未回答だけ表示";
  });
  document.getElementById("btnReset").addEventListener("click", function () {
    if (!confirm("100問すべての答えを消します。よろしいですか？")) return;
    answers = {}; save(); hide(); render();
  });
  document.getElementById("total").textContent = DATA.length;
  render();
})();
</script>

</body>
</html>
